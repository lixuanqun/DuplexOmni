name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,serve]"
      - name: Lint
        run: ruff check duplexomni tests examples
      - name: Test
        run: pytest

  test-notorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install pytest websockets
          pip install -e . --no-deps
      - name: Core tests without torch
        run: pytest tests/test_tokens.py tests/test_scenario.py tests/test_director.py tests/test_checks.py tests/test_slicer.py tests/test_gateway_core.py tests/test_gateway_session.py tests/test_gateway_llm.py tests/test_gateway_server.py
