[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "duplexomni"
version = "0.1.0"
description = "Full-duplex voice agent and DuplexOmni reference (arXiv:2606.09186): barge-in, streaming ASR/TTS, task delegation, and an async thinking layer. Runnable browser gateway, no GPU required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DuplexOmni contributors" }]
keywords = [
    "full-duplex",
    "full-duplex-speech",
    "voice-agent",
    "voice-assistant",
    "speech-interaction",
    "spoken-dialogue",
    "barge-in",
    "turn-taking",
    "streaming-asr",
    "streaming-tts",
    "realtime-voice",
    "task-delegation",
    "speech-language-model",
    "thinker-talker",
    "websocket",
    "duplexomni",
    "arxiv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.4", "websockets>=13"]
serve = ["websockets>=13"]

[project.scripts]
duplexomni = "duplexomni.cli:main"

[project.urls]
Homepage = "https://github.com/lixuanqun/DuplexOmni"
Paper = "https://arxiv.org/abs/2606.09186"

[tool.hatch.build.targets.wheel]
packages = ["duplexomni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
