[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "duplexomni"
version = "0.1.0"
description = "Engineering reference implementation of DuplexOmni (arXiv:2606.09186): full-duplex speech interaction with decoupled interaction/thinking layers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DuplexOmni contributors" }]
keywords = [
    "full-duplex",
    "speech-language-model",
    "spoken-dialogue",
    "real-time",
    "multimodal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
duplexomni = "duplexomni.cli:main"

[project.urls]
Homepage = "https://github.com/lixuanqun/DuplexOmni"
Paper = "https://arxiv.org/abs/2606.09186"

[tool.hatch.build.targets.wheel]
packages = ["duplexomni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
